name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

env:
  AI_REVIEW: ""

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run AI review script
        env:
          PR_URL: ${{ github.event.pull_request.url }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          chmod +x .github/scripts/ai_review.sh
          .github/scripts/ai_review.sh

      - name: Post comment to PR
        uses: actions/github-script@v7
        env:
          AI_REVIEW: ${{ env.AI_REVIEW }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const raw = process.env.AI_REVIEW;
            let text = "Erreur : réponse IA vide ou non valide.";
            try {
              const json = JSON.parse(raw);
              if (json.choices && json.choices.length > 0 && json.choices[0].message) {
                text = json.choices[0].message.content;
              } else if (json.detail) {
                text = "Erreur API : " + json.detail;
              }
            } catch (e) {
              text = "Erreur JSON parsing : " + raw;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🤖 **Review automatique IA (via Meta‑Llama 3.1 8B)**\n\n" + text
            });
