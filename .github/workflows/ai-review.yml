name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 🔥 Diff fiable pour TOUTES les PR, même depuis un fork
      - name: Get PR diff
        id: diff
        run: |
          echo "Fetching PR diff..."
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr
          git diff pr > diff.txt

          echo "DIFF<<EOF" >> $GITHUB_OUTPUT
          cat diff.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 🤖 Appel IA via HuggingFace Router (nouveau système)
      - name: Call HuggingFace Inference API
        id: hf
        run: |
          DIFF=$(sed 's/"/\\"/g' diff.txt)

          PROMPT="Tu es un expert en Playwright et TypeScript. Analyse STRICTEMENT le diff suivant.
          - Trouve ABSOLUMENT TOUTES les erreurs, même mineures
          - Variables non utilisées
          - Imports inutilisés
          - Code mort
          - Mauvaises pratiques Playwright
          - Risques de tests flaky
          - Duplication inutile
          - Mauvais selectors / mauvaise gestion des attentes
          Donne :
          1. Résumé général
          2. Liste détaillée des problèmes
          3. Suggestions avec code corrigé
          Diff : $DIFF"

          PAYLOAD="{\"inputs\": \"$PROMPT\"}"

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            https://router.huggingface.co/deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct)

          echo "$RESPONSE" > ai_review.json

          echo "REVIEW<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 📝 Commentaire dans la Pull Request
      - name: Post comment on PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const review = `${{ steps.hf.outputs.REVIEW }}`.trim();

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🤖 **Review automatique IA (DeepSeek Coder)**\n\n" + review
            });
