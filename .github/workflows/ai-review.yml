name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR diff
        id: diff
        run: |
          curl -s -H "Accept: application/vnd.github.v3.diff" \
            "${{ github.event.pull_request.url }}" > diff.txt

          echo "DIFF<<EOF" >> $GITHUB_OUTPUT
          cat diff.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call HuggingFace Router (DeepSeek)
        id: hf
        run: |
          DIFF=$(sed 's/"/\\"/g' diff.txt)

          PROMPT="Analyse le diff suivant comme expert Playwright + TypeScript.
          Trouve :
          - variables non utilisées
          - imports inutiles
          - code mort
          - selectors fragiles
          - tests potentiellement flaky
          - mauvaises pratiques Playwright

          Fournis :
          1. Résumé clair
          2. Liste des problèmes détectés
          3. Suggestions + code corrigé

          Diff : $DIFF"

          JSON=$(jq -n --arg prompt "$PROMPT" '{
            model: "deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct",
            messages: [
              {role: "user", content: $prompt}
            ],
            max_tokens: 800,
            temperature: 0.2
          }')

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$JSON" \
            https://router.huggingface.co/v1/chat/completions)

          echo "REVIEW<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post comment to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const raw = `${{ steps.hf.outputs.REVIEW }}`;
            let text = "Erreur : réponse IA vide ou non valide.";

            try {
              const json = JSON.parse(raw);
              text = json.choices?.[0]?.message?.content || text;
            } catch (e)
