name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR diff
        id: diff
        run: |
          curl -s -H "Accept: application/vnd.github.v3.diff" \
            "${{ github.event.pull_request.url }}" > diff.txt

          echo "DIFF<<EOF" >> $GITHUB_OUTPUT
          cat diff.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call HuggingFace (DeepSeek)
        id: hf
        run: |
          DIFF=$(sed 's/"/\\"/g' diff.txt)

          PROMPT="Analyse le diff suivant en tant qu'expert Playwright et TypeScript.
          Signale :
          - variables non utilisées
          - imports inutiles
          - code mort
          - selectors fragiles
          - test flaky potentiels
          - mauvaises pratiques
          
          Fournis :
          1. Résumé général
          2. Liste des problèmes
          3. Code corrigé

          Diff : $DIFF"

          JSON="{\"inputs\": \"${PROMPT//\"/\\\"}\"}"

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$JSON" \
            https://api-inference.huggingface.co/models/deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct)

          echo "REVIEW<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post comment to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const raw = `${{ steps.hf.outputs.REVIEW }}`.trim();
            let msg = "⚠️ Impossible d'interpréter la réponse IA";

            try {
              const j = JSON.parse(raw);
              msg = j[0]?.generated_text || j.generated_text || raw;
            } catch {
              msg = raw;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🤖 **Review automatique IA (DeepSeek)**\n\n" + msg
            });
